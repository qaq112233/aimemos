services:
  memogram:
    build:
      context: .
      args:
        VERSION: ${MEMOGRAM_VERSION:-}
        COMMIT: ${MEMOGRAM_COMMIT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NOTEBOOK_CONFIG: /app/notebook.yaml
      DATA: /data/data.txt
      WEB_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./notebook.yaml:/app/notebook.yaml:ro
      - memogram-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  memogram-data:
